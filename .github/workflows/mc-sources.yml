name: MC-Quellen ansehen
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/mc-sources.yml']
permissions:
  contents: write
jobs:
  src:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - run: python3 .github/versions.py
      - name: Quellen erzeugen
        working-directory: orderalert
        run: gradle genSourcesWithVineflower --no-daemon -q || gradle genSources --no-daemon -q
      - name: Dateien einsammeln
        run: |
          mkdir -p out x
          J=$(find ~/.gradle orderalert/.gradle -name "*minecraft*sources.jar" 2>/dev/null | grep -v fabric-api | head -1)
          echo "Jar: $J"
          cd x && unzip -q "$J" && cd ..
          for c in com/mojang/blaze3d/opengl/GlTexture com/mojang/blaze3d/opengl/GlTextureView com/mojang/blaze3d/opengl/GlDevice com/mojang/blaze3d/textures/GpuTexture com/mojang/blaze3d/textures/GpuTextureView \
                   net/minecraft/client/gui/GuiGraphics net/minecraft/client/gui/render/TextureSetup net/minecraft/client/gui/render/state/BlitRenderState \
                   com/mojang/blaze3d/systems/RenderSystem com/mojang/blaze3d/opengl/GlStateManager net/minecraft/client/renderer/texture/AbstractTexture \
                   net/minecraft/client/input/MouseButtonEvent net/minecraft/client/input/MouseButtonInfo com/mojang/blaze3d/textures/TextureFormat; do
            f=x/$c.java; [ -f "$f" ] && cp "$f" out/$(basename $c).java.txt || echo "fehlt: $c"
          done
          ls out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: deps-mc-sources
          name: MC-Quellen (nur zum Nachschauen)
          prerelease: true
          files: out/*
