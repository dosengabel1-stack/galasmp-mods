name: Bedrock-Hilfen (verschluesselt)
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/bedrock.yml', '.github/vanilla/**']
permissions:
  contents: write
jobs:
  bedrock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Vanilla-Texturen (Glas)
        run: |
          set -e
          url=$(curl -s https://piston-meta.mojang.com/mc/game/version_manifest_v2.json | python3 -c "import json,sys;print([v['url'] for v in json.load(sys.stdin)['versions'] if v['id']=='1.21.11'][0])")
          jar=$(curl -s "$url" | python3 -c "import json,sys;print(json.load(sys.stdin)['downloads']['client']['url'])")
          curl -s -o client.jar "$jar"
          mkdir -p out/tex && cd out/tex && unzip -q ../../client.jar 'assets/minecraft/textures/block/*glass*' 'assets/minecraft/models/item/*glass_pane*' 'assets/minecraft/items/*glass_pane*' || true
          cd ../..
      - name: GeyserDisplayEntity bauen
        run: |
          set -e
          git clone --depth 1 https://github.com/GeyserExtensionists/GeyserDisplayEntity gde
          cd gde && chmod +x gradlew && ./gradlew build --no-daemon -q || ./gradlew shadowJar --no-daemon
          ls -la build/libs
          mkdir -p ../out/gde && cp build/libs/*.jar ../out/gde/ && cp packs/*.mcpack ../out/gde/
      - name: Geyser-Spigot (zum Abgleichen)
        run: |
          set -e
          mkdir -p out/geyser
          curl -sL -o out/geyser/Geyser-Spigot.jar https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
          curl -sL -o out/geyser/builds.json https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest
          ls -la out/geyser
      - name: Packen
        run: |
          tar cf b.tar -C out .
          openssl cms -encrypt -binary -aes256 -in b.tar -out bedrock.enc -outform DER .github/vanilla/recipient.pem
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: tmp-bedrock
          name: tmp (verschluesselt)
          prerelease: true
          files: bedrock.enc
