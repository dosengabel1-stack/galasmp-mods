name: Bedrock-Hilfen (verschluesselt)
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/bedrock.yml', '.github/vanilla/**']
permissions:
  contents: write
jobs:
  bedrock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Vanilla-Bloecke
        run: |
          set -e
          url=$(curl -s https://piston-meta.mojang.com/mc/game/version_manifest_v2.json | python3 -c "import json,sys;print([v['url'] for v in json.load(sys.stdin)['versions'] if v['id']=='1.21.11'][0])")
          jar=$(curl -s "$url" | python3 -c "import json,sys;print(json.load(sys.stdin)['downloads']['client']['url'])")
          curl -s -o client.jar "$jar"
          mkdir -p out && cd out && unzip -q ../client.jar 'assets/minecraft/models/block/*' 'assets/minecraft/textures/block/*' 'assets/minecraft/textures/entity/shulker/*' 'assets/minecraft/blockstates/*' 'assets/minecraft/items/*' 'assets/minecraft/models/item/*' || true
          cd ..
      - name: Packen
        run: |
          tar cf b.tar -C out .
          openssl cms -encrypt -binary -aes256 -in b.tar -out blocks.enc -outform DER .github/vanilla/recipient.pem
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: tmp-blocks
          name: tmp (verschluesselt)
          prerelease: true
          files: blocks.enc
