name: Mods bauen
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Versionen holen
        run: python3 .github/versions.py
      - name: OreGlow bauen
        working-directory: oreglow
        shell: bash
        run: |
          set -o pipefail
          gradle build --no-daemon 2>&1 | tee build.log || {
            msg=$(grep -E "error:|What went wrong|Could not|Caused by|> .*" build.log | grep -v "^> Task" | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=OreGlow::$msg"
            exit 1
          }
      - name: OrderAlert bauen
        working-directory: orderalert
        shell: bash
        run: |
          set -o pipefail
          gradle build --no-daemon 2>&1 | tee build.log || {
            msg=$(grep -E "error:|What went wrong|Could not|Caused by|> .*" build.log | grep -v "^> Task" | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=OrderAlert::$msg"
            exit 1
          }
      - name: VideoWindow bauen
        working-directory: videowindow
        shell: bash
        run: |
          set -o pipefail
          gradle build --no-daemon 2>&1 | tee build.log || {
            msg=$(grep -E "error:|What went wrong|Could not|Caused by|> .*" build.log | grep -v "^> Task" | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=VideoWindow::$msg"
            exit 1
          }
      - name: JARs einsammeln
        run: |
          mkdir out
          cp oreglow/build/libs/OreGlow-*.jar out/ && cp orderalert/build/libs/OrderAlert-*.jar out/ && cp videowindow/build/libs/VideoWindow-*.jar out/
          rm -f out/*-sources.jar
          ls -la out
      - name: WaterMedia dazulegen (Video-Player fuer VideoWindow)
        run: |
          python3 - <<'PY'
          import json, urllib.request
          H = {"User-Agent": "galasmp-mods build"}
          q = 'https://api.modrinth.com/v2/project/watermedia/version?game_versions=%5B%221.21.11%22%5D&loaders=%5B%22fabric%22%5D'
          v = json.load(urllib.request.urlopen(urllib.request.Request(q, headers=H), timeout=60))[0]
          f = next((f for f in v["files"] if f.get("primary")), v["files"][0])
          print("WaterMedia:", v["version_number"], f["filename"])
          open("out/" + f["filename"], "wb").write(urllib.request.urlopen(urllib.request.Request(f["url"], headers=H), timeout=120).read())
          PY
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: mods
          path: out/*.jar
      - name: Download-Seite (Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mods (Build ${{ github.run_number }})
          files: out/*.jar
