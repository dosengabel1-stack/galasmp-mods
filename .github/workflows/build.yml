name: Mods bauen
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Versionen holen
        run: python3 .github/versions.py
      - name: OreGlow bauen
        working-directory: oreglow
        run: gradle build --no-daemon --stacktrace
      - name: OrderAlert bauen
        working-directory: orderalert
        run: gradle build --no-daemon --stacktrace
      - name: JARs einsammeln
        run: |
          mkdir out
          cp oreglow/build/libs/OreGlow-*.jar out/ && cp orderalert/build/libs/OrderAlert-*.jar out/
          rm -f out/*-sources.jar
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: mods
          path: out/*.jar
      - name: Download-Seite (Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mods (Build ${{ github.run_number }})
          files: out/*.jar
