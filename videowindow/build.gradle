plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = '1.0.0'
group = 'net.galasmp'
base { archivesName = 'VideoWindow' }

repositories {
    mavenCentral()
    maven { name = 'DimasKama'; url = 'https://maven.dimaskama.net/releases' }
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // Browser (Chromium) - MCEF Modern muss als eigene Mod installiert sein
    modCompileOnly("maven.modrinth:mcef-modern:${mcef_version}") { transitive = false }
    compileOnly "me.friwi:jcef-api:${jcef_api_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21; it.options.encoding = 'UTF-8' }
